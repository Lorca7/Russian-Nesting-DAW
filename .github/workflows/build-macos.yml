name: Build macOS app

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    # Latest hosted macOS runner. The app targets macOS 11+ (so it runs on Sonoma 14.6)
    # and is a universal binary (Apple silicon + Intel).
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test (engine + headless audio/MIDI/WAV render)
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Package
        run: |
          set -e
          ART="build/MatryoshkaFugue_artefacts/Release"
          mkdir -p "dist/Matryoshka Fugue/Plug-ins"
          cp -R "$ART/Standalone/Matryoshka Fugue.app" "dist/Matryoshka Fugue/"
          cp -R "$ART/VST3/Matryoshka Fugue.vst3" "dist/Matryoshka Fugue/Plug-ins/"
          cp -R "$ART/AU/Matryoshka Fugue.component" "dist/Matryoshka Fugue/Plug-ins/"
          # Ad-hoc signature so Apple silicon will run it; it is not notarised (see README).
          codesign --force --deep --sign - "dist/Matryoshka Fugue/Matryoshka Fugue.app"
          codesign --force --deep --sign - "dist/Matryoshka Fugue/Plug-ins/Matryoshka Fugue.vst3"
          codesign --force --deep --sign - "dist/Matryoshka Fugue/Plug-ins/Matryoshka Fugue.component"
          cp docs/INSTALL-macOS.txt "dist/Matryoshka Fugue/READ ME FIRST.txt"
          lipo -info "dist/Matryoshka Fugue/Matryoshka Fugue.app/Contents/MacOS/Matryoshka Fugue"
          otool -l "dist/Matryoshka Fugue/Matryoshka Fugue.app/Contents/MacOS/Matryoshka Fugue" | grep -A3 LC_BUILD_VERSION | head -4
          hdiutil create -volname "Matryoshka Fugue" -srcfolder "dist/Matryoshka Fugue" -ov -format UDZO "dist/Matryoshka-Fugue-macOS.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Matryoshka-Fugue-macOS
          path: dist/Matryoshka-Fugue-macOS.dmg
          if-no-files-found: error

  linux-check:
    # Quick compile + test check on Linux (same code, Standalone only).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libgl1-mesa-dev ninja-build xvfb fonts-dejavu
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMF_BUILD_SNAPSHOT=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Render UI snapshots
        run: |
          SNAP=$(find build -type f -name UISnapshot -perm -u+x | head -1)
          xvfb-run -a -s "-screen 0 1920x1200x24" "$SNAP" ui-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: ui-snapshots/*.png
          if-no-files-found: error
